<!DOCTYPE html>
<html lang="en" class="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Video Call — NEVO</title>
    <style id="theme-vars">
/* NEVO GUI Design System — Amber Gold Theme */
/* Brand: NEVO VoIP — Secure Voice Communication */

:root {
  /* === Color System === */
  --color-primary: #F5B731;
  --color-primary-hover: #E0A528;
  --color-primary-dim: rgba(245, 183, 49, 0.12);
  --color-primary-subtle: rgba(245, 183, 49, 0.06);

  --color-bg-base: #0F0D0A;
  --color-bg-secondary: #16140F;
  --color-bg-tertiary: #1D1A13;
  --color-bg-elevated: #242017;
  --color-bg-hover: #2B2619;
  --color-bg-active: #332D1F;
  --color-bg-overlay: rgba(0, 0, 0, 0.65);

  --color-border: #2B2619;
  --color-border-light: #3D3625;
  --color-border-focus: #F5B731;

  --color-text-primary: #F0ECE4;
  --color-text-secondary: #A89E8A;
  --color-text-muted: #756B58;
  --color-text-inverse: #0F0D0A;
  --color-text-link: #F5B731;

  --color-surface-card: #16140F;
  --color-surface-sunken: #12100B;

  /* State colors */
  --state-success: #34D399;
  --state-success-dim: rgba(52, 211, 153, 0.12);
  --state-warning: #FBBF24;
  --state-warning-dim: rgba(251, 191, 36, 0.12);
  --state-error: #F87171;
  --state-error-dim: rgba(248, 113, 113, 0.12);
  --state-info: #60A5FA;
  --state-info-dim: rgba(96, 165, 250, 0.12);

  /* === Typography === */
  --font-sans: 'Inter', 'MiSans', 'PingFang SC', 'Microsoft YaHei', sans-serif;
  --font-mono: 'JetBrains Mono', 'SF Mono', 'Cascadia Code', monospace;

  --text-xs: 0.6875rem;    /* 11px */
  --text-sm: 0.8125rem;    /* 13px */
  --text-base: 0.875rem;   /* 14px */
  --text-lg: 1rem;         /* 16px */
  --text-xl: 1.125rem;     /* 18px */
  --text-2xl: 1.375rem;    /* 22px */
  --text-3xl: 1.75rem;     /* 28px */

  --leading-tight: 1.25;
  --leading-normal: 1.5;
  --leading-relaxed: 1.65;

  --tracking-tight: -0.02em;
  --tracking-normal: 0;
  --tracking-wide: 0.04em;

  --weight-regular: 400;
  --weight-medium: 500;
  --weight-semibold: 600;
  --weight-bold: 700;

  /* === Radius === */
  --radius-sm: 4px;
  --radius-md: 8px;
  --radius-lg: 12px;
  --radius-xl: 16px;
  --radius-full: 9999px;

  /* === Spacing === */
  --space-1: 4px;
  --space-2: 8px;
  --space-3: 12px;
  --space-4: 16px;
  --space-5: 20px;
  --space-6: 24px;
  --space-8: 32px;
  --space-10: 40px;
  --space-12: 48px;

  /* === Surface & Depth === */
  --shadow-card: 0 1px 2px rgba(0, 0, 0, 0.04);
  --shadow-elevated: 0 4px 12px rgba(0, 0, 0, 0.04);
  --shadow-modal: 0 8px 32px rgba(0, 0, 0, 0.5);
  --shadow-floating: 0 4px 16px rgba(0, 0, 0, 0.5);

  /* === Transitions === */
  --transition-fast: 0.12s ease;
  --transition-normal: 0.2s ease;
  --transition-slow: 0.35s cubic-bezier(0.4, 0, 0.2, 1);
}

/* === Utility Classes === */
.heading-xl {
  font-family: var(--font-sans);
  font-size: var(--text-3xl);
  font-weight: var(--weight-bold);
  line-height: var(--leading-tight);
  letter-spacing: var(--tracking-tight);
  color: var(--color-text-primary);
}

.heading-lg {
  font-family: var(--font-sans);
  font-size: var(--text-2xl);
  font-weight: var(--weight-semibold);
  line-height: var(--leading-tight);
  letter-spacing: var(--tracking-tight);
  color: var(--color-text-primary);
}

.heading-md {
  font-family: var(--font-sans);
  font-size: var(--text-xl);
  font-weight: var(--weight-semibold);
  line-height: var(--leading-tight);
  color: var(--color-text-primary);
}

.heading-sm {
  font-family: var(--font-sans);
  font-size: var(--text-base);
  font-weight: var(--weight-semibold);
  line-height: var(--leading-normal);
  color: var(--color-text-primary);
}

.body-md {
  font-family: var(--font-sans);
  font-size: var(--text-base);
  font-weight: var(--weight-regular);
  line-height: var(--leading-normal);
  color: var(--color-text-secondary);
}

.caption {
  font-family: var(--font-sans);
  font-size: var(--text-xs);
  font-weight: var(--weight-medium);
  line-height: var(--leading-normal);
  color: var(--color-text-muted);
  text-transform: uppercase;
  letter-spacing: var(--tracking-wide);
}

.mono {
  font-family: var(--font-mono);
}

    </style>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4.3.1/dist/index.global.js"></script>
    <script src="https://unpkg.com/lucide@1.8.0/dist/umd/lucide.min.js"></script>
    <style type="text/tailwindcss">
  @theme inline {
    --color-primary: var(--color-primary);
    --color-border: var(--color-border);
  }
  @layer base {
    body { background: var(--color-bg-base); color: var(--color-text-primary); }
    td, th { @apply break-words; word-break: break-all; word-break: auto-phrase; }
    th { @apply whitespace-nowrap; }
  }
    </style>
    <style>
      .no-scrollbar::-webkit-scrollbar { display: none; }
      .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
      [data-icon] {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        -webkit-mask-size: contain;
        mask-size: contain;
        -webkit-mask-repeat: no-repeat;
        mask-repeat: no-repeat;
        -webkit-mask-position: center;
        mask-position: center;
        background-color: currentColor;
      }
    </style>
</head>
<body class="min-h-screen font-sans antialiased">
    <main class="relative w-full h-screen overflow-hidden" style="background: var(--color-bg-base);">

      <!-- Vignette overlay -->
      <div class="absolute inset-0 pointer-events-none z-10" style="box-shadow: inset 0 0 120px 40px rgba(0,0,0,0.5);"></div>

      <!-- Main remote video area -->
      <div class="absolute inset-0 flex flex-col items-center justify-center z-0" style="background: linear-gradient(180deg, var(--color-bg-secondary) 0%, var(--color-bg-base) 100%);">

        <!-- Subtle grid pattern overlay -->
        <div class="absolute inset-0 opacity-[0.03]" style="background-image: linear-gradient(var(--color-text-muted) 1px, transparent 1px), linear-gradient(90deg, var(--color-text-muted) 1px, transparent 1px); background-size: 40px 40px;"></div>

        <!-- Connection quality indicator (top-left) -->
        <div class="absolute top-6 left-6 z-20 inline-flex items-center gap-2 px-3 py-1.5" style="background: rgba(0,0,0,0.4); border-radius: var(--radius-full); backdrop-filter: blur(8px);">
          <span class="w-2 h-2 shrink-0" style="background: var(--state-success); border-radius: var(--radius-full);"></span>
          <span class="text-xs whitespace-nowrap" style="color: var(--color-text-secondary); font-family: var(--font-sans);">稳定</span>
        </div>

        <!-- Call duration timer (top-center) -->
        <div class="absolute top-6 left-1/2 -translate-x-1/2 z-20 px-4 py-1.5" style="background: rgba(0,0,0,0.4); border-radius: var(--radius-full); backdrop-filter: blur(8px);">
          <span class="mono text-sm whitespace-nowrap" style="color: var(--color-text-primary);">03:24</span>
        </div>

        <!-- E2E encryption badge (top-right, beside fullscreen) -->
        <div class="absolute top-6 right-16 z-20 inline-flex items-center gap-2 px-3 py-1.5" style="background: rgba(0,0,0,0.4); border-radius: var(--radius-full); backdrop-filter: blur(8px);">
          <i data-lucide="lock" class="w-3 h-3" style="color: var(--color-primary);"></i>
          <span class="text-xs whitespace-nowrap" style="color: var(--color-text-secondary); font-family: var(--font-sans);">E2E 加密</span>
        </div>

        <!-- Fullscreen toggle (top-right) -->
        <button class="absolute top-6 right-6 z-20 w-9 h-9 inline-flex items-center justify-center transition-opacity duration-200 hover:opacity-80" style="background: rgba(0,0,0,0.4); border-radius: var(--radius-lg); backdrop-filter: blur(8px); color: var(--color-text-secondary);" aria-label="Toggle fullscreen">
          <i data-lucide="maximize" class="w-4 h-4"></i>
        </button>

        <!-- Remote user avatar + name -->
        <div class="relative z-10 flex flex-col items-center gap-4">
          <div class="w-28 h-28 flex items-center justify-center" style="background: var(--color-bg-elevated); border-radius: var(--radius-full); border: 2px solid var(--color-border);">
            <span class="heading-xl" style="color: var(--color-text-muted);">B</span>
          </div>
          <span class="heading-sm" style="color: var(--color-text-secondary);">Bob</span>
        </div>
      </div>

      <!-- Self video picture-in-picture (bottom-right) -->
      <div class="absolute z-20 flex flex-col items-center justify-center gap-1" style="bottom: 120px; right: 32px; width: 240px; height: 180px; background: var(--color-bg-secondary); border-radius: var(--radius-lg); border: 2px solid var(--color-primary); box-shadow: var(--shadow-elevated);">
        <div class="w-12 h-12 flex items-center justify-center" style="background: var(--color-bg-elevated); border-radius: var(--radius-full);">
          <span class="heading-sm" style="color: var(--color-text-muted);">A</span>
        </div>
        <span class="text-xs whitespace-nowrap" style="color: var(--color-text-muted); font-family: var(--font-sans);">你</span>
      </div>

      <!-- Control bar (bottom center, floating pill) -->
      <div class="absolute z-30 flex items-center gap-3 px-5 py-3" style="bottom: 32px; left: 50%; transform: translateX(-50%); background: var(--color-bg-secondary); border-radius: var(--radius-full); box-shadow: var(--shadow-modal); backdrop-filter: blur(16px); border: 1px solid var(--color-border);">

        <!-- Mic toggle (active) -->
        <button class="w-12 h-12 shrink-0 inline-flex items-center justify-center transition-all duration-200 hover:opacity-80" style="background: var(--color-primary-dim); border-radius: var(--radius-full); color: var(--color-primary);" aria-label="Toggle microphone">
          <i data-lucide="mic" class="w-5 h-5"></i>
        </button>

        <!-- Camera toggle (active) -->
        <button class="w-12 h-12 shrink-0 inline-flex items-center justify-center transition-all duration-200 hover:opacity-80" style="background: var(--color-primary-dim); border-radius: var(--radius-full); color: var(--color-primary);" aria-label="Toggle camera">
          <i data-lucide="video" class="w-5 h-5"></i>
        </button>

        <!-- Screen share -->
        <button class="w-12 h-12 shrink-0 inline-flex items-center justify-center transition-all duration-200 hover:opacity-80" style="background: var(--color-bg-hover); border-radius: var(--radius-full); color: var(--color-text-secondary);" aria-label="Share screen">
          <i data-lucide="monitor" class="w-5 h-5"></i>
        </button>

        <!-- Settings -->
        <button class="w-12 h-12 shrink-0 inline-flex items-center justify-center transition-all duration-200 hover:opacity-80" style="background: var(--color-bg-hover); border-radius: var(--radius-full); color: var(--color-text-secondary);" aria-label="Settings">
          <i data-lucide="settings" class="w-5 h-5"></i>
        </button>

        <!-- Hang up (RED) -->
        <button class="w-12 h-12 shrink-0 inline-flex items-center justify-center transition-all duration-200 hover:opacity-90" style="background: var(--state-error); border-radius: var(--radius-full); color: var(--color-text-inverse);" aria-label="Hang up">
          <i data-lucide="phone-off" class="w-5 h-5"></i>
        </button>
      </div>

    </main>
    <script>lucide.createIcons();</script>
</body>
</html>

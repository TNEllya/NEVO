<!DOCTYPE html>
<html lang="zh-CN" class="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NEVO 设置（浅色）</title>
    <style id="theme-vars">
/* NEVO Voice Chat — Light Theme: Yellow-Black */
/* Prefix: nevo */

:root {
  /* === Color System === */
  /* Primary: Warm amber-yellow — energetic, distinctive */
  --color-primary: #E5A800;
  --color-primary-hover: #CC9600;
  --color-primary-active: #B38500;
  --color-primary-muted: rgba(229, 168, 0, 0.10);
  --color-primary-foreground: #1A1200;

  /* Neutrals: Light warm surface system */
  --color-bg-base: #FAFAF8;
  --color-bg-surface: #FFFFFF;
  --color-bg-elevated: #FFFFFF;
  --color-bg-overlay: #F0EFE8;
  --color-bg-hover: #F5F4EE;
  --color-bg-active: #EDECE4;

  /* Text — dark primary for light theme */
  --color-text-primary: #1A1A1C;
  --color-text-secondary: #5C5C66;
  --color-text-tertiary: #8E8E96;
  --color-text-inverse: #FAFAF8;

  /* Border */
  --color-border: #E4E3DC;
  --color-border-hover: #CFCEDA;
  --color-border-active: #B8B8C4;

  /* State colors */
  --state-success: #2E9E5A;
  --state-warning: #E5A800;
  --state-error: #D63B3B;
  --state-info: #3B7DD8;

  /* Voice activity glow */
  --color-voice-active: #E5A800;
  --color-voice-idle: #D4D3CC;

  /* === Typography === */
  --font-family-display: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
  --font-family-body: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
  --font-family-mono: 'JetBrains Mono', 'Fira Code', 'Consolas', monospace;

  --font-size-xs: 11px;
  --font-size-sm: 13px;
  --font-size-base: 14px;
  --font-size-md: 15px;
  --font-size-lg: 17px;
  --font-size-xl: 20px;
  --font-size-2xl: 24px;
  --font-size-3xl: 30px;

  --font-weight-regular: 400;
  --font-weight-medium: 500;
  --font-weight-semibold: 600;
  --font-weight-bold: 700;

  --line-height-tight: 1.2;
  --line-height-normal: 1.5;
  --line-height-relaxed: 1.65;

  /* === Spacing === */
  --spacing-xs: 4px;
  --spacing-sm: 8px;
  --spacing-md: 12px;
  --spacing-lg: 16px;
  --spacing-xl: 24px;
  --spacing-2xl: 32px;
  --spacing-3xl: 48px;

  /* === Radius === */
  --radius-sm: 4px;
  --radius-md: 8px;
  --radius-lg: 12px;
  --radius-full: 9999px;

  /* === Shadow === */
  --shadow-sm: 0 1px 2px rgba(0, 0, 0, 0.04);
  --shadow-md: 0 2px 8px rgba(0, 0, 0, 0.04);
  --shadow-lg: 0 8px 24px rgba(0, 0, 0, 0.05);
  --shadow-floating: 0 12px 32px rgba(0, 0, 0, 0.12);

  /* === Transitions === */
  --transition-fast: 150ms ease;
  --transition-normal: 200ms ease;
  --transition-slow: 300ms ease;
}

/* Utility classes */
.nevo-h1 { font-family: var(--font-family-display); font-size: var(--font-size-3xl); font-weight: var(--font-weight-bold); line-height: var(--line-height-tight); color: var(--color-text-primary); }
.nevo-h2 { font-family: var(--font-family-display); font-size: var(--font-size-2xl); font-weight: var(--font-weight-semibold); line-height: var(--line-height-tight); color: var(--color-text-primary); }
.nevo-h3 { font-family: var(--font-family-display); font-size: var(--font-size-xl); font-weight: var(--font-weight-semibold); line-height: var(--line-height-tight); color: var(--color-text-primary); }
.nevo-h4 { font-family: var(--font-family-display); font-size: var(--font-size-lg); font-weight: var(--font-weight-medium); line-height: var(--line-height-normal); color: var(--color-text-primary); }
.nevo-body { font-family: var(--font-family-body); font-size: var(--font-size-base); font-weight: var(--font-weight-regular); line-height: var(--line-height-normal); color: var(--color-text-primary); }
.nevo-body-sm { font-family: var(--font-family-body); font-size: var(--font-size-sm); font-weight: var(--font-weight-regular); line-height: var(--line-height-normal); color: var(--color-text-secondary); }
.nevo-caption { font-family: var(--font-family-body); font-size: var(--font-size-xs); font-weight: var(--font-weight-medium); line-height: var(--line-height-normal); color: var(--color-text-tertiary); text-transform: uppercase; letter-spacing: 0.05em; }

    </style>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4.3.1/dist/index.global.js"></script>
    <script src="https://unpkg.com/lucide@1.8.0/dist/umd/lucide.min.js"></script>
    <style type="text/tailwindcss">
  @theme inline {
    --color-primary: var(--color-primary);
    --color-primary-foreground: var(--color-primary-foreground);
    --color-border: var(--color-border);
  }
  @layer base {
    body { background: var(--color-bg-base); color: var(--color-text-primary); }
    td, th { @apply break-words; word-break: break-all; word-break: auto-phrase; }
    th { @apply whitespace-nowrap; }
  }
    </style>
    <style>
      .no-scrollbar::-webkit-scrollbar { display: none; }
      .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
      [data-icon] {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        -webkit-mask-size: contain;
        mask-size: contain;
        -webkit-mask-repeat: no-repeat;
        mask-repeat: no-repeat;
        -webkit-mask-position: center;
        mask-position: center;
        background-color: currentColor;
      }
    </style>
</head>
<body class="min-h-screen font-sans antialiased">
    <main style="width: 1440px; height: 900px; overflow: hidden; background: var(--color-bg-base); font-family: var(--font-family-body);">

      <!-- Top Header Bar -->
      <header style="display: flex; align-items: center; justify-content: space-between; height: 56px; padding: 0 var(--spacing-xl); border-bottom: 1px solid var(--color-border); background: var(--color-bg-surface);">
        <div style="display: flex; align-items: center; gap: var(--spacing-sm);">
          <button style="display: inline-flex; align-items: center; gap: 6px; padding: 6px 12px; border: none; background: transparent; color: var(--color-text-secondary); cursor: pointer; font-size: var(--font-size-base); font-family: var(--font-family-body); border-radius: var(--radius-sm); transition: background 150ms ease, color 150ms ease;" onmouseover="this.style.background='var(--color-bg-hover)';this.style.color='var(--color-text-primary)'" onmouseout="this.style.background='transparent';this.style.color='var(--color-text-secondary)'">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5"/><path d="M12 19l-7-7 7-7"/></svg>
            返回
          </button>
        </div>
        <h1 style="font-size: var(--font-size-xl); font-weight: var(--font-weight-semibold); color: var(--color-text-primary); text-wrap: balance; word-break: keep-all;">设置</h1>
        <div style="font-size: var(--font-size-xs); color: var(--color-text-tertiary);">v2.1.0</div>
      </header>

      <!-- Settings Layout -->
      <div style="display: flex; height: calc(900px - 56px);">

        <!-- Left Navigation -->
        <nav style="width: 200px; min-width: 200px; padding: var(--spacing-xl) var(--spacing-lg); border-right: 1px solid var(--color-border); background: var(--color-bg-surface); display: flex; flex-direction: column; gap: 2px;">
          <!-- Account -->
          <a href="#" style="display: flex; align-items: center; gap: 10px; padding: 10px var(--spacing-md); border-radius: var(--radius-md); color: var(--color-text-secondary); text-decoration: none; font-size: var(--font-size-base); transition: background 150ms ease, color 150ms ease;" onmouseover="this.style.background='var(--color-bg-hover)'" onmouseout="this.style.background='transparent'">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
            账户
          </a>
          <!-- Audio (Active) -->
          <a href="#" style="display: flex; align-items: center; gap: 10px; padding: 10px var(--spacing-md); border-radius: var(--radius-md); background: var(--color-primary-muted); color: var(--color-primary); text-decoration: none; font-size: var(--font-size-base); font-weight: var(--font-weight-medium);" onclick="return false;">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2a3 3 0 0 0-3 3v7a3 3 0 0 0 6 0V5a3 3 0 0 0-3-3z"/><path d="M19 10v2a7 7 0 0 1-14 0v-2"/><line x1="12" y1="19" x2="12" y2="22"/></svg>
            音频设置
          </a>
          <!-- Video -->
          <a href="#" style="display: flex; align-items: center; gap: 10px; padding: 10px var(--spacing-md); border-radius: var(--radius-md); color: var(--color-text-secondary); text-decoration: none; font-size: var(--font-size-base); transition: background 150ms ease, color 150ms ease;" onmouseover="this.style.background='var(--color-bg-hover)'" onmouseout="this.style.background='transparent'">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M23 7l-7 5 7 5V7z"/><rect x="1" y="5" width="15" height="14" rx="2" ry="2"/></svg>
            视频设置
          </a>
          <!-- Notifications -->
          <a href="#" style="display: flex; align-items: center; gap: 10px; padding: 10px var(--spacing-md); border-radius: var(--radius-md); color: var(--color-text-secondary); text-decoration: none; font-size: var(--font-size-base); transition: background 150ms ease, color 150ms ease;" onmouseover="this.style.background='var(--color-bg-hover)'" onmouseout="this.style.background='transparent'">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.73 21a2 2 0 0 1-3.46 0"/></svg>
            通知
          </a>
          <!-- Hotkeys -->
          <a href="#" style="display: flex; align-items: center; gap: 10px; padding: 10px var(--spacing-md); border-radius: var(--radius-md); color: var(--color-text-secondary); text-decoration: none; font-size: var(--font-size-base); transition: background 150ms ease, color 150ms ease;" onmouseover="this.style.background='var(--color-bg-hover)'" onmouseout="this.style.background='transparent'">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="4" width="20" height="16" rx="2"/><path d="M6 8h.001"/><path d="M10 8h.001"/><path d="M14 8h.001"/><path d="M18 8h.001"/><path d="M8 12h.001"/><path d="M12 12h.001"/><path d="M16 12h.001"/><path d="M7 16h10"/></svg>
            快捷键
          </a>
          <!-- About -->
          <a href="#" style="display: flex; align-items: center; gap: 10px; padding: 10px var(--spacing-md); border-radius: var(--radius-md); color: var(--color-text-secondary); text-decoration: none; font-size: var(--font-size-base); transition: background 150ms ease, color 150ms ease;" onmouseover="this.style.background='var(--color-bg-hover)'" onmouseout="this.style.background='transparent'">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><line x1="12" y1="16" x2="12" y2="12"/><line x1="12" y1="8" x2="12.01" y2="8"/></svg>
            关于
          </a>
        </nav>

        <!-- Right Content Panel -->
        <div style="flex: 1; overflow-y: auto; padding: var(--spacing-2xl); background: var(--color-bg-base);">

          <!-- Section: 输入设备 -->
          <section style="margin-bottom: var(--spacing-2xl);">
            <h2 style="font-size: var(--font-size-lg); font-weight: var(--font-weight-semibold); color: var(--color-text-primary); margin-bottom: var(--spacing-lg); text-wrap: balance; word-break: keep-all;">输入设备</h2>

            <!-- Microphone Label -->
            <div style="display: flex; align-items: center; gap: var(--spacing-lg); margin-bottom: var(--spacing-md);">
              <label style="width: 140px; min-width: 140px; font-size: var(--font-size-sm); color: var(--color-text-secondary);">麦克风</label>
              <div style="flex: 1; max-width: 400px; position: relative;">
                <select style="width: 100%; height: 36px; padding: 0 var(--spacing-lg) 0 var(--spacing-md); background: var(--color-bg-elevated); border: 1px solid var(--color-border); border-radius: var(--radius-sm); color: var(--color-text-primary); font-size: var(--font-size-sm); font-family: var(--font-family-body); appearance: none; cursor: pointer; transition: border-color 150ms ease; outline: none;" onfocus="this.style.borderColor='var(--color-primary)'" onblur="this.style.borderColor='var(--color-border)'" onmouseover="this.style.borderColor='var(--color-border-hover)'" onmouseout="this.style.borderColor='var(--color-border)'">
                  <option>内置麦克风 (Built-in Microphone)</option>
                  <option>USB Audio Device</option>
                  <option>External Microphone</option>
                </select>
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="var(--color-text-tertiary)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="position: absolute; right: 12px; top: 50%; transform: translateY(-50%); pointer-events: none;"><polyline points="6 9 12 15 18 9"/></svg>
              </div>
            </div>

            <!-- Volume Meter -->
            <div style="display: flex; align-items: center; gap: var(--spacing-lg); margin-bottom: var(--spacing-md);">
              <label style="width: 140px; min-width: 140px;"></label>
              <div style="flex: 1; max-width: 400px;">
                <div style="height: 8px; background: var(--color-bg-active); border-radius: var(--radius-full); overflow: hidden; position: relative;">
                  <div style="width: 45%; height: 100%; border-radius: var(--radius-full); background: linear-gradient(90deg, var(--color-primary), var(--color-primary-hover)); transition: width 300ms ease; animation: meterPulse 2s ease-in-out infinite;"></div>
                </div>
                <div style="display: flex; justify-content: space-between; margin-top: 4px;">
                  <span style="font-size: var(--font-size-xs); color: var(--color-text-tertiary);">音量</span>
                  <span style="font-size: var(--font-size-xs); color: var(--color-text-tertiary);">45%</span>
                </div>
              </div>
            </div>

            <!-- Input Sensitivity Slider -->
            <div style="display: flex; align-items: center; gap: var(--spacing-lg); margin-bottom: var(--spacing-md);">
              <label style="width: 140px; min-width: 140px; font-size: var(--font-size-sm); color: var(--color-text-secondary);">输入灵敏度</label>
              <div style="flex: 1; max-width: 400px;">
                <input type="range" min="0" max="100" value="65" style="width: 100%; height: 4px; appearance: none; background: var(--color-bg-active); border-radius: var(--radius-full); outline: none; cursor: pointer; transition: opacity 150ms ease;" onmouseover="this.style.opacity='0.9'" onmouseout="this.style.opacity='1'">
              </div>
            </div>

            <!-- Test Button -->
            <div style="display: flex; align-items: center; gap: var(--spacing-lg);">
              <label style="width: 140px; min-width: 140px;"></label>
              <button style="display: inline-flex; align-items: center; justify-content: center; gap: 6px; padding: 7px 16px; background: var(--color-primary-muted); border: 1px solid rgba(229, 168, 0, 0.25); border-radius: var(--radius-sm); color: var(--color-primary); font-size: var(--font-size-sm); font-family: var(--font-family-body); cursor: pointer; white-space: nowrap; transition: background 150ms ease, transform 120ms ease;" onmouseover="this.style.background='rgba(229, 168, 0, 0.18)';this.style.transform='translateY(-1px)'" onmouseout="this.style.background='var(--color-primary-muted)';this.style.transform='translateY(0)'">
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="5 3 19 12 5 21 5 3"/></svg>
                测试麦克风
              </button>
            </div>
          </section>

          <!-- Separator -->
          <div style="height: 1px; background: var(--color-border); margin-bottom: var(--spacing-2xl);"></div>

          <!-- Section: 输出设备 -->
          <section style="margin-bottom: var(--spacing-2xl);">
            <h2 style="font-size: var(--font-size-lg); font-weight: var(--font-weight-semibold); color: var(--color-text-primary); margin-bottom: var(--spacing-lg); text-wrap: balance; word-break: keep-all;">输出设备</h2>

            <!-- Speaker Label -->
            <div style="display: flex; align-items: center; gap: var(--spacing-lg); margin-bottom: var(--spacing-md);">
              <label style="width: 140px; min-width: 140px; font-size: var(--font-size-sm); color: var(--color-text-secondary);">扬声器</label>
              <div style="flex: 1; max-width: 400px; position: relative;">
                <select style="width: 100%; height: 36px; padding: 0 var(--spacing-lg) 0 var(--spacing-md); background: var(--color-bg-elevated); border: 1px solid var(--color-border); border-radius: var(--radius-sm); color: var(--color-text-primary); font-size: var(--font-size-sm); font-family: var(--font-family-body); appearance: none; cursor: pointer; transition: border-color 150ms ease; outline: none;" onfocus="this.style.borderColor='var(--color-primary)'" onblur="this.style.borderColor='var(--color-border)'" onmouseover="this.style.borderColor='var(--color-border-hover)'" onmouseout="this.style.borderColor='var(--color-border)'">
                  <option>内置扬声器 (Built-in Speakers)</option>
                  <option>USB Audio Device</option>
                  <option>Headphones</option>
                </select>
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="var(--color-text-tertiary)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="position: absolute; right: 12px; top: 50%; transform: translateY(-50%); pointer-events: none;"><polyline points="6 9 12 15 18 9"/></svg>
              </div>
            </div>

            <!-- Volume Slider -->
            <div style="display: flex; align-items: center; gap: var(--spacing-lg); margin-bottom: var(--spacing-md);">
              <label style="width: 140px; min-width: 140px; font-size: var(--font-size-sm); color: var(--color-text-secondary);">输出音量</label>
              <div style="flex: 1; max-width: 400px; display: flex; align-items: center; gap: var(--spacing-sm);">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="var(--color-text-tertiary)" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/></svg>
                <input type="range" min="0" max="100" value="75" style="flex: 1; height: 4px; appearance: none; background: var(--color-bg-active); border-radius: var(--radius-full); outline: none; cursor: pointer; transition: opacity 150ms ease;" onmouseover="this.style.opacity='0.9'" onmouseout="this.style.opacity='1'">
                <span style="font-size: var(--font-size-sm); color: var(--color-text-tertiary); min-width: 32px; text-align: right;">75%</span>
              </div>
            </div>

            <!-- Output Volume Meter -->
            <div style="display: flex; align-items: center; gap: var(--spacing-lg);">
              <label style="width: 140px; min-width: 140px;"></label>
              <div style="flex: 1; max-width: 400px;">
                <div style="height: 8px; background: var(--color-bg-active); border-radius: var(--radius-full); overflow: hidden;">
                  <div style="width: 75%; height: 100%; border-radius: var(--radius-full); background: linear-gradient(90deg, var(--color-primary), var(--color-primary-hover));"></div>
                </div>
              </div>
            </div>
          </section>

          <!-- Separator -->
          <div style="height: 1px; background: var(--color-border); margin-bottom: var(--spacing-2xl);"></div>

          <!-- Section: 高级设置 -->
          <section style="margin-bottom: var(--spacing-2xl);">
            <h2 style="font-size: var(--font-size-lg); font-weight: var(--font-weight-semibold); color: var(--color-text-primary); margin-bottom: var(--spacing-lg); text-wrap: balance; word-break: keep-all;">高级设置</h2>

            <!-- Noise Suppression Toggle (ON) -->
            <div style="display: flex; align-items: center; gap: var(--spacing-lg); margin-bottom: var(--spacing-md);">
              <label style="width: 140px; min-width: 140px; font-size: var(--font-size-sm); color: var(--color-text-secondary);">噪声抑制</label>
              <div style="width: 40px; height: 22px; background: var(--color-primary); border-radius: var(--radius-full); cursor: pointer; position: relative; transition: background 150ms ease; flex-shrink: 0;">
                <div style="width: 18px; height: 18px; background: white; border-radius: var(--radius-full); position: absolute; top: 2px; left: 20px; transition: left 150ms ease;"></div>
              </div>
              <span style="font-size: var(--font-size-sm); color: var(--color-text-tertiary);">开启</span>
            </div>

            <!-- Echo Cancellation Toggle (ON) -->
            <div style="display: flex; align-items: center; gap: var(--spacing-lg); margin-bottom: var(--spacing-md);">
              <label style="width: 140px; min-width: 140px; font-size: var(--font-size-sm); color: var(--color-text-secondary);">回声消除</label>
              <div style="width: 40px; height: 22px; background: var(--color-primary); border-radius: var(--radius-full); cursor: pointer; position: relative; transition: background 150ms ease; flex-shrink: 0;">
                <div style="width: 18px; height: 18px; background: white; border-radius: var(--radius-full); position: absolute; top: 2px; left: 20px; transition: left 150ms ease;"></div>
              </div>
              <span style="font-size: var(--font-size-sm); color: var(--color-text-tertiary);">开启</span>
            </div>

            <!-- Auto Gain Control Toggle (OFF) -->
            <div style="display: flex; align-items: center; gap: var(--spacing-lg); margin-bottom: var(--spacing-md);">
              <label style="width: 140px; min-width: 140px; font-size: var(--font-size-sm); color: var(--color-text-secondary);">自动调节增益</label>
              <div style="width: 40px; height: 22px; background: var(--color-bg-active); border-radius: var(--radius-full); cursor: pointer; position: relative; transition: background 150ms ease; flex-shrink: 0;">
                <div style="width: 18px; height: 18px; background: white; border-radius: var(--radius-full); position: absolute; top: 2px; left: 2px; transition: left 150ms ease; box-shadow: 0 1px 2px rgba(0,0,0,0.12);"></div>
              </div>
              <span style="font-size: var(--font-size-sm); color: var(--color-text-tertiary);">关闭</span>
            </div>

            <!-- Audio Codec Dropdown -->
            <div style="display: flex; align-items: center; gap: var(--spacing-lg);">
              <label style="width: 140px; min-width: 140px; font-size: var(--font-size-sm); color: var(--color-text-secondary);">音频编码</label>
              <div style="flex: 1; max-width: 400px; position: relative;">
                <select style="width: 100%; height: 36px; padding: 0 var(--spacing-lg) 0 var(--spacing-md); background: var(--color-bg-elevated); border: 1px solid var(--color-border); border-radius: var(--radius-sm); color: var(--color-text-primary); font-size: var(--font-size-sm); font-family: var(--font-family-body); appearance: none; cursor: pointer; transition: border-color 150ms ease; outline: none;" onfocus="this.style.borderColor='var(--color-primary)'" onblur="this.style.borderColor='var(--color-border)'" onmouseover="this.style.borderColor='var(--color-border-hover)'" onmouseout="this.style.borderColor='var(--color-border)'">
                  <option>Opus 48kHz</option>
                  <option>Opus 24kHz</option>
                  <option>Opus 16kHz</option>
                  <option>Opus 8kHz</option>
                </select>
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="var(--color-text-tertiary)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="position: absolute; right: 12px; top: 50%; transform: translateY(-50%); pointer-events: none;"><polyline points="6 9 12 15 18 9"/></svg>
              </div>
            </div>
          </section>

          <!-- Separator -->
          <div style="height: 1px; background: var(--color-border); margin-bottom: var(--spacing-2xl);"></div>

          <!-- Section: 语音活动检测 -->
          <section style="margin-bottom: var(--spacing-2xl);">
            <h2 style="font-size: var(--font-size-lg); font-weight: var(--font-weight-semibold); color: var(--color-text-primary); margin-bottom: var(--spacing-lg); text-wrap: balance; word-break: keep-all;">语音活动检测</h2>

            <!-- Radio Options -->
            <div style="display: flex; align-items: center; gap: var(--spacing-lg); margin-bottom: var(--spacing-md);">
              <label style="width: 140px; min-width: 140px;"></label>
              <div style="display: flex; gap: var(--spacing-xl);">
                <label style="display: flex; align-items: center; gap: var(--spacing-sm); cursor: pointer;">
                  <div style="width: 16px; height: 16px; border: 2px solid var(--color-primary); border-radius: var(--radius-full); display: flex; align-items: center; justify-content: center;">
                    <div style="width: 8px; height: 8px; background: var(--color-primary); border-radius: var(--radius-full);"></div>
                  </div>
                  <span style="font-size: var(--font-size-sm); color: var(--color-text-primary);">语音激活</span>
                </label>
                <label style="display: flex; align-items: center; gap: var(--spacing-sm); cursor: pointer;">
                  <div style="width: 16px; height: 16px; border: 2px solid var(--color-border-hover); border-radius: var(--radius-full); display: flex; align-items: center; justify-content: center; transition: border-color 150ms ease;" onmouseover="this.style.borderColor='var(--color-primary)'" onmouseout="this.style.borderColor='var(--color-border-hover)'">
                  </div>
                  <span style="font-size: var(--font-size-sm); color: var(--color-text-secondary);">按键说话</span>
                </label>
              </div>
            </div>

            <!-- Sensitivity Slider -->
            <div style="display: flex; align-items: center; gap: var(--spacing-lg); margin-bottom: var(--spacing-md);">
              <label style="width: 140px; min-width: 140px; font-size: var(--font-size-sm); color: var(--color-text-secondary);">检测灵敏度</label>
              <div style="flex: 1; max-width: 400px; display: flex; align-items: center; gap: var(--spacing-sm);">
                <input type="range" min="0" max="100" value="50" style="flex: 1; height: 4px; appearance: none; background: var(--color-bg-active); border-radius: var(--radius-full); outline: none; cursor: pointer; transition: opacity 150ms ease;" onmouseover="this.style.opacity='0.9'" onmouseout="this.style.opacity='1'">
                <span style="font-size: var(--font-size-sm); color: var(--color-text-tertiary); min-width: 32px; text-align: right;">50%</span>
              </div>
            </div>

            <!-- Push-to-talk Key Binding -->
            <div style="display: flex; align-items: center; gap: var(--spacing-lg);">
              <label style="width: 140px; min-width: 140px; font-size: var(--font-size-sm); color: var(--color-text-secondary);">按键绑定</label>
              <div style="display: inline-flex; align-items: center; padding: 6px 14px; background: var(--color-bg-elevated); border: 1px solid var(--color-border); border-radius: var(--radius-sm); cursor: pointer; transition: border-color 150ms ease;" onmouseover="this.style.borderColor='var(--color-border-hover)'" onmouseout="this.style.borderColor='var(--color-border)'">
                <span style="font-size: var(--font-size-sm); color: var(--color-text-secondary); font-family: var(--font-family-mono);">鼠标中键</span>
              </div>
            </div>
          </section>

          <!-- Separator -->
          <div style="height: 1px; background: var(--color-border); margin-bottom: var(--spacing-2xl);"></div>

          <!-- Action Buttons -->
          <div style="display: flex; align-items: center; gap: var(--spacing-lg);">
            <button style="display: inline-flex; align-items: center; justify-content: center; padding: 9px 24px; background: var(--color-primary); border: none; border-radius: var(--radius-md); color: var(--color-primary-foreground); font-size: var(--font-size-sm); font-weight: var(--font-weight-semibold); font-family: var(--font-family-body); cursor: pointer; white-space: nowrap; transition: background 150ms ease, transform 120ms ease;" onmouseover="this.style.background='var(--color-primary-hover)';this.style.transform='translateY(-1px)'" onmouseout="this.style.background='var(--color-primary)';this.style.transform='translateY(0)'">
              保存更改
            </button>
            <button style="display: inline-flex; align-items: center; justify-content: center; padding: 9px 16px; background: transparent; border: none; color: var(--color-text-secondary); font-size: var(--font-size-sm); font-family: var(--font-family-body); cursor: pointer; white-space: nowrap; transition: color 150ms ease;" onmouseover="this.style.color='var(--color-text-primary)'" onmouseout="this.style.color='var(--color-text-secondary)'">
              重置默认
            </button>
          </div>

        </div>
      </div>

    </main>
    <style>
      @keyframes meterPulse {
        0%, 100% { width: 35%; }
        50% { width: 55%; }
      }
      input[type="range"]::-webkit-slider-thumb {
        -webkit-appearance: none;
        width: 14px;
        height: 14px;
        background: var(--color-primary);
        border-radius: var(--radius-full);
        cursor: pointer;
        border: 2px solid var(--color-bg-base);
        box-shadow: 0 0 0 1px var(--color-primary);
        transition: transform 150ms ease, box-shadow 150ms ease;
      }
      input[type="range"]::-webkit-slider-thumb:hover {
        transform: scale(1.15);
        box-shadow: 0 0 0 2px rgba(229, 168, 0, 0.3);
      }
      input[type="range"]::-moz-range-thumb {
        width: 14px;
        height: 14px;
        background: var(--color-primary);
        border-radius: var(--radius-full);
        cursor: pointer;
        border: 2px solid var(--color-bg-base);
        box-shadow: 0 0 0 1px var(--color-primary);
      }
      select option {
        background: var(--color-bg-elevated);
        color: var(--color-text-primary);
      }
      @media (prefers-reduced-motion: reduce) {
        @keyframes meterPulse {
          0%, 100% { width: 45%; }
        }
        * {
          transition-duration: 0.01ms !important;
          animation-duration: 0.01ms !important;
        }
      }
    </style>
    <script>lucide.createIcons();</script>
</body>
</html>

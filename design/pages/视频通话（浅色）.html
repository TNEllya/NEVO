<!DOCTYPE html>
<html lang="zh-CN" class="light" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NEVO 视频通话（浅色）</title>
    <style id="theme-vars">
/* NEVO Voice Chat — Light Theme: Yellow-Black */
/* Prefix: nevo */

:root {
  /* === Color System === */
  /* Primary: Warm amber-yellow — energetic, distinctive */
  --color-primary: #E5A800;
  --color-primary-hover: #CC9600;
  --color-primary-active: #B38500;
  --color-primary-muted: rgba(229, 168, 0, 0.10);
  --color-primary-foreground: #1A1200;

  /* Neutrals: Light warm surface system */
  --color-bg-base: #FAFAF8;
  --color-bg-surface: #FFFFFF;
  --color-bg-elevated: #FFFFFF;
  --color-bg-overlay: #F0EFE8;
  --color-bg-hover: #F5F4EE;
  --color-bg-active: #EDECE4;

  /* Text — dark primary for light theme */
  --color-text-primary: #1A1A1C;
  --color-text-secondary: #5C5C66;
  --color-text-tertiary: #8E8E96;
  --color-text-inverse: #FAFAF8;

  /* Border */
  --color-border: #E4E3DC;
  --color-border-hover: #CFCEDA;
  --color-border-active: #B8B8C4;

  /* State colors */
  --state-success: #2E9E5A;
  --state-warning: #E5A800;
  --state-error: #D63B3B;
  --state-info: #3B7DD8;

  /* Voice activity glow */
  --color-voice-active: #E5A800;
  --color-voice-idle: #D4D3CC;

  /* === Typography === */
  --font-family-display: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
  --font-family-body: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
  --font-family-mono: 'JetBrains Mono', 'Fira Code', 'Consolas', monospace;

  --font-size-xs: 11px;
  --font-size-sm: 13px;
  --font-size-base: 14px;
  --font-size-md: 15px;
  --font-size-lg: 17px;
  --font-size-xl: 20px;
  --font-size-2xl: 24px;
  --font-size-3xl: 30px;

  --font-weight-regular: 400;
  --font-weight-medium: 500;
  --font-weight-semibold: 600;
  --font-weight-bold: 700;

  --line-height-tight: 1.2;
  --line-height-normal: 1.5;
  --line-height-relaxed: 1.65;

  /* === Spacing === */
  --spacing-xs: 4px;
  --spacing-sm: 8px;
  --spacing-md: 12px;
  --spacing-lg: 16px;
  --spacing-xl: 24px;
  --spacing-2xl: 32px;
  --spacing-3xl: 48px;

  /* === Radius === */
  --radius-sm: 4px;
  --radius-md: 8px;
  --radius-lg: 12px;
  --radius-full: 9999px;

  /* === Shadow === */
  --shadow-sm: 0 1px 2px rgba(0, 0, 0, 0.04);
  --shadow-md: 0 2px 8px rgba(0, 0, 0, 0.04);
  --shadow-lg: 0 8px 24px rgba(0, 0, 0, 0.05);
  --shadow-floating: 0 12px 32px rgba(0, 0, 0, 0.12);

  /* === Transitions === */
  --transition-fast: 150ms ease;
  --transition-normal: 200ms ease;
  --transition-slow: 300ms ease;
}

/* Utility classes */
.nevo-h1 { font-family: var(--font-family-display); font-size: var(--font-size-3xl); font-weight: var(--font-weight-bold); line-height: var(--line-height-tight); color: var(--color-text-primary); }
.nevo-h2 { font-family: var(--font-family-display); font-size: var(--font-size-2xl); font-weight: var(--font-weight-semibold); line-height: var(--line-height-tight); color: var(--color-text-primary); }
.nevo-h3 { font-family: var(--font-family-display); font-size: var(--font-size-xl); font-weight: var(--font-weight-semibold); line-height: var(--line-height-tight); color: var(--color-text-primary); }
.nevo-h4 { font-family: var(--font-family-display); font-size: var(--font-size-lg); font-weight: var(--font-weight-medium); line-height: var(--line-height-normal); color: var(--color-text-primary); }
.nevo-body { font-family: var(--font-family-body); font-size: var(--font-size-base); font-weight: var(--font-weight-regular); line-height: var(--line-height-normal); color: var(--color-text-primary); }
.nevo-body-sm { font-family: var(--font-family-body); font-size: var(--font-size-sm); font-weight: var(--font-weight-regular); line-height: var(--line-height-normal); color: var(--color-text-secondary); }
.nevo-caption { font-family: var(--font-family-body); font-size: var(--font-size-xs); font-weight: var(--font-weight-medium); line-height: var(--line-height-normal); color: var(--color-text-tertiary); text-transform: uppercase; letter-spacing: 0.05em; }

    </style>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4.3.1/dist/index.global.js"></script>
    <script src="https://unpkg.com/lucide@1.8.0/dist/umd/lucide.min.js"></script>
    <style type="text/tailwindcss">
  @theme inline {
    --color-primary: var(--color-primary);
    --color-primary-foreground: var(--color-primary-foreground);
    --color-border: var(--color-border);
  }
  @layer base {
    body { background: var(--color-bg-base); color: var(--color-text-primary); }
    td, th { @apply break-words; word-break: break-all; word-break: auto-phrase; }
    th { @apply whitespace-nowrap; }
  }
    </style>
    <style>
      .no-scrollbar::-webkit-scrollbar { display: none; }
      .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
      [data-icon] {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        -webkit-mask-size: contain;
        mask-size: contain;
        -webkit-mask-repeat: no-repeat;
        mask-repeat: no-repeat;
        -webkit-mask-position: center;
        mask-position: center;
        background-color: currentColor;
      }
    </style>
</head>
<body class="min-h-screen font-sans antialiased">
    <main style="width: 1440px; height: 900px; overflow: hidden; position: relative; background: var(--color-bg-base); margin: 0 auto;">

      <!-- Full-bleed remote video area (light gradient placeholder) -->
      <div style="position: absolute; inset: 0; background: linear-gradient(160deg, #F5F4EE 0%, #EDECE4 40%, #F0EFE8 70%, #F5F4EE 100%); z-index: 0;">
        <!-- Subtle warm pattern overlay for video placeholder -->
        <div style="position: absolute; inset: 0; opacity: 0.04; background-image: radial-gradient(circle at 30% 40%, var(--color-primary) 0%, transparent 50%), radial-gradient(circle at 70% 60%, var(--color-primary) 0%, transparent 40%);"></div>
      </div>

      <!-- Caller avatar centered (no-video state) -->
      <div style="position: absolute; inset: 0; z-index: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; pointer-events: none;">
        <div style="width: 96px; height: 96px; border-radius: var(--radius-full); background: var(--color-bg-surface); display: flex; align-items: center; justify-content: center; border: 2px solid var(--color-border);">
          <svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="var(--color-text-secondary)" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
            <path d="M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2"/>
            <circle cx="12" cy="7" r="4"/>
          </svg>
        </div>
        <p style="margin-top: 16px; font-size: 20px; font-weight: var(--font-weight-semibold); color: var(--color-text-primary); font-family: var(--font-family-display); letter-spacing: 0;">张三</p>
        <p style="margin-top: 4px; font-size: var(--font-size-sm); color: var(--color-text-tertiary); font-family: var(--font-family-body);">对方摄像头已关闭</p>
      </div>

      <!-- Top bar overlay -->
      <header style="position: absolute; top: 0; left: 0; right: 0; z-index: 10; display: flex; align-items: center; justify-content: space-between; padding: 20px 32px; background: linear-gradient(180deg, rgba(250,250,248,0.85) 0%, transparent 100%);">
        <!-- Left: Back button -->
        <a href="#" style="display: inline-flex; align-items: center; gap: 8px; color: var(--color-text-secondary); text-decoration: none; font-size: var(--font-size-base); font-family: var(--font-family-body); padding: 8px 12px; border-radius: var(--radius-md); transition: background var(--transition-fast); cursor: pointer;" onmouseover="this.style.background='rgba(0,0,0,0.06)'" onmouseout="this.style.background='transparent'">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
            <path d="m15 18-6-6 6-6"/>
          </svg>
          <span>返回</span>
        </a>

        <!-- Center: Caller info -->
        <div style="display: flex; align-items: center; gap: 12px;">
          <span style="font-size: var(--font-size-lg); font-weight: var(--font-weight-semibold); color: var(--color-text-primary); font-family: var(--font-family-display);">张三</span>
          <span style="font-size: var(--font-size-sm); color: var(--color-text-secondary); font-family: var(--font-family-mono); font-variant-numeric: tabular-nums;">12:34</span>
          <span style="width: 6px; height: 6px; border-radius: var(--radius-full); background: var(--color-primary); display: inline-block; animation: pulse-dot 2s ease-in-out infinite;"></span>
        </div>

        <!-- Right: Connection quality + encryption -->
        <div style="display: flex; align-items: center; gap: 16px;">
          <!-- Connection quality -->
          <div style="display: flex; align-items: center; gap: 6px;" title="连接质量：良好">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="var(--color-primary)" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
              <path d="M2 20h.01"/>
              <path d="M7 20v-4"/>
              <path d="M12 20v-8"/>
              <path d="M17 20V8"/>
            </svg>
            <span style="font-size: var(--font-size-xs); color: var(--color-text-tertiary); font-family: var(--font-family-body);">良好</span>
          </div>
          <!-- Encryption badge -->
          <div style="display: flex; align-items: center; gap: 6px;" title="端到端加密">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="var(--color-text-tertiary)" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
              <rect width="18" height="11" x="3" y="11" rx="2" ry="2"/>
              <path d="M7 11V7a5 5 0 0 1 10 0v4"/>
            </svg>
          </div>
        </div>
      </header>

      <!-- Self-view floating PiP (bottom-right) -->
      <div style="position: absolute; bottom: 120px; right: 32px; z-index: 10; width: 240px; height: 180px; border-radius: var(--radius-lg); border: 1px solid var(--color-border); overflow: hidden; box-shadow: var(--shadow-floating); background: linear-gradient(135deg, var(--color-bg-surface) 0%, var(--color-bg-overlay) 100%); cursor: grab; transition: transform var(--transition-normal), box-shadow var(--transition-normal);" onmouseover="this.style.transform='scale(1.02)'" onmouseout="this.style.transform='scale(1)'">
        <!-- Self camera placeholder -->
        <div style="width: 100%; height: 100%; display: flex; flex-direction: column; align-items: center; justify-content: center;">
          <div style="width: 56px; height: 56px; border-radius: var(--radius-full); background: var(--color-bg-overlay); display: flex; align-items: center; justify-content: center;">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="var(--color-text-tertiary)" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
              <path d="M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2"/>
              <circle cx="12" cy="7" r="4"/>
            </svg>
          </div>
          <span style="margin-top: 8px; font-size: var(--font-size-xs); color: var(--color-text-tertiary); font-family: var(--font-family-body);">你的摄像头</span>
        </div>
        <!-- PiP drag handle indicator -->
        <div style="position: absolute; top: 8px; left: 50%; transform: translateX(-50%); width: 32px; height: 3px; border-radius: 2px; background: rgba(0,0,0,0.12);"></div>
      </div>

      <!-- Bottom control bar (frosted glass - light theme) -->
      <div style="position: absolute; bottom: 32px; left: 50%; transform: translateX(-50%); z-index: 10;">
        <div style="display: flex; align-items: center; gap: 8px; padding: 16px 28px; border-radius: var(--radius-lg); background: rgba(255, 255, 255, 0.72); backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px); border: 1px solid rgba(228,227,220,0.6);">

          <!-- Mic toggle -->
          <button aria-label="麦克风" style="display: flex; flex-direction: column; align-items: center; gap: 6px; background: transparent; border: none; cursor: pointer; padding: 8px 12px; border-radius: var(--radius-md); transition: background var(--transition-fast), transform var(--transition-fast);" onmouseover="this.style.background='rgba(0,0,0,0.06)'" onmouseout="this.style.background='transparent'" onmousedown="this.style.transform='scale(0.95)'" onmouseup="this.style.transform='scale(1)'" onfocus="this.style.outline='2px solid var(--color-primary)';this.style.outlineOffset='2px'" onblur="this.style.outline='none';this.style.outlineOffset='0'">
            <div style="width: 48px; height: 48px; border-radius: var(--radius-full); background: var(--color-bg-overlay); display: flex; align-items: center; justify-content: center; border: 2px solid var(--color-primary); transition: border-color var(--transition-fast);">
              <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="var(--color-primary)" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
                <path d="M12 2a3 3 0 0 0-3 3v7a3 3 0 0 0 6 0V5a3 3 0 0 0-3-3Z"/>
                <path d="M19 10v2a7 7 0 0 1-14 0v-2"/>
                <line x1="12" x2="12" y1="19" y2="22"/>
              </svg>
            </div>
            <span style="font-size: 11px; color: var(--color-text-secondary); font-family: var(--font-family-body); white-space: nowrap;">麦克风</span>
          </button>

          <!-- Camera toggle -->
          <button aria-label="摄像头" style="display: flex; flex-direction: column; align-items: center; gap: 6px; background: transparent; border: none; cursor: pointer; padding: 8px 12px; border-radius: var(--radius-md); transition: background var(--transition-fast), transform var(--transition-fast);" onmouseover="this.style.background='rgba(0,0,0,0.06)'" onmouseout="this.style.background='transparent'" onmousedown="this.style.transform='scale(0.95)'" onmouseup="this.style.transform='scale(1)'" onfocus="this.style.outline='2px solid var(--color-primary)';this.style.outlineOffset='2px'" onblur="this.style.outline='none';this.style.outlineOffset='0'">
            <div style="width: 48px; height: 48px; border-radius: var(--radius-full); background: var(--color-bg-overlay); display: flex; align-items: center; justify-content: center; border: 2px solid var(--color-primary); transition: border-color var(--transition-fast);">
              <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="var(--color-primary)" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
                <path d="M14.5 4h-5L7 7H4a2 2 0 0 0-2 2v9a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2V9a2 2 0 0 0-2-2h-3l-2.5-3z"/>
                <circle cx="12" cy="13" r="3"/>
              </svg>
            </div>
            <span style="font-size: 11px; color: var(--color-text-secondary); font-family: var(--font-family-body); white-space: nowrap;">摄像头</span>
          </button>

          <!-- Screen share -->
          <button aria-label="屏幕共享" style="display: flex; flex-direction: column; align-items: center; gap: 6px; background: transparent; border: none; cursor: pointer; padding: 8px 12px; border-radius: var(--radius-md); transition: background var(--transition-fast), transform var(--transition-fast);" onmouseover="this.style.background='rgba(0,0,0,0.06)'" onmouseout="this.style.background='transparent'" onmousedown="this.style.transform='scale(0.95)'" onmouseup="this.style.transform='scale(1)'" onfocus="this.style.outline='2px solid var(--color-primary)';this.style.outlineOffset='2px'" onblur="this.style.outline='none';this.style.outlineOffset='0'">
            <div style="width: 48px; height: 48px; border-radius: var(--radius-full); background: var(--color-bg-overlay); display: flex; align-items: center; justify-content: center; border: 2px solid transparent; transition: border-color var(--transition-fast);">
              <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="var(--color-text-secondary)" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
                <rect width="20" height="14" x="2" y="3" rx="2"/>
                <line x1="8" x2="16" y1="21" y2="21"/>
                <line x1="12" x2="12" y1="17" y2="21"/>
              </svg>
            </div>
            <span style="font-size: 11px; color: var(--color-text-secondary); font-family: var(--font-family-body); white-space: nowrap;">共享屏幕</span>
          </button>

          <!-- Divider -->
          <div style="width: 1px; height: 56px; background: var(--color-border); margin: 0 4px;"></div>

          <!-- Hang up -->
          <button aria-label="结束通话" style="display: flex; flex-direction: column; align-items: center; gap: 6px; background: transparent; border: none; cursor: pointer; padding: 8px 12px; border-radius: var(--radius-md); transition: background var(--transition-fast), transform var(--transition-fast);" onmouseover="this.style.background='rgba(214,59,59,0.08)'" onmouseout="this.style.background='transparent'" onmousedown="this.style.transform='scale(0.95)'" onmouseup="this.style.transform='scale(1)'" onfocus="this.style.outline='2px solid var(--color-primary)';this.style.outlineOffset='2px'" onblur="this.style.outline='none';this.style.outlineOffset='0'">
            <div style="width: 56px; height: 56px; border-radius: var(--radius-full); background: var(--state-error); display: flex; align-items: center; justify-content: center; box-shadow: 0 4px 16px rgba(214,59,59,0.25); transition: box-shadow var(--transition-fast);">
              <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="var(--color-text-inverse)" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
                <path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72 12.84 12.84 0 0 0 .7 2.81 2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45 12.84 12.84 0 0 0 2.81.7A2 2 0 0 1 22 16.92z"/>
              </svg>
            </div>
            <span style="font-size: 11px; color: var(--color-text-secondary); font-family: var(--font-family-body); white-space: nowrap;">结束通话</span>
          </button>
        </div>
      </div>

      <!-- Chat toggle button (right edge) -->
      <button aria-label="通话聊天" style="position: absolute; right: 0; top: 50%; transform: translateY(-50%); z-index: 10; width: 40px; height: 80px; background: rgba(255, 255, 255, 0.6); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px); border: 1px solid var(--color-border); border-right: none; border-radius: var(--radius-md) 0 0 var(--radius-md); display: flex; align-items: center; justify-content: center; cursor: pointer; transition: background var(--transition-fast), width var(--transition-normal);" onmouseover="this.style.background='rgba(255,255,255,0.85)'" onmouseout="this.style.background='rgba(255,255,255,0.6)'" onfocus="this.style.outline='2px solid var(--color-primary)';this.style.outlineOffset='-2px'" onblur="this.style.outline='none'">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="var(--color-text-secondary)" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
          <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/>
        </svg>
      </button>

    </main>

    <style>
      @keyframes pulse-dot {
        0%, 100% { opacity: 1; }
        50% { opacity: 0.4; }
      }
      @media (prefers-reduced-motion: reduce) {
        *, *::before, *::after {
          animation-duration: 0.01ms !important;
          transition-duration: 0.01ms !important;
        }
      }
    </style>
    <script>lucide.createIcons();</script>
</body>
</html>
